# Os testes, com um Postgres descartavel.
#
#   docker compose -f docker-compose.test.yml run --rm --build test
#
# Este banco vive em memoria (tmpfs) e morre junto com o comando — ele existe
# so para os testes. E de proposito que ele NAO e o do docker-compose.yml: os
# testes limpam as tabelas antes de cada caso, e apontar isso para o banco de
# verdade apagaria as moedas e a rodada de todo mundo.
#
# O codigo entra no container pelo BUILD (a etapa de compilacao do Dockerfile),
# e nao por pasta montada. Montar pasta do Windows no Docker Desktop ja travou a
# criacao do container sem mensagem nenhuma; o build nao depende disso, e de
# quebra ja prova que a imagem compila. O `--build` do comando acima e o que faz
# a imagem acompanhar o codigo novo.

name: majorflyer-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teste
      POSTGRES_PASSWORD: teste
      POSTGRES_DB: teste
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teste -d teste"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://teste:teste@db:5432/teste?sslmode=disable
    command: sh -c "go vet ./... && go test ./... -count=1 -v"
