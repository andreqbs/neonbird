# -----------------------------------------------------------------------------
# Servidor da pagina de privacidade do Major Flyer.
#
# Incluido em /etc/nginx/conf.d/ pela imagem oficial do nginx, entao este
# arquivo ja esta DENTRO do bloco `http` — por isso o `map` abaixo funciona.
# -----------------------------------------------------------------------------

# Anonimiza o IP antes de escrever no log. A politica (Secao 17) promete que os
# registros do servidor nao servem para identificar visitante; aqui a promessa
# vira configuracao, e nao so texto. IPv4 perde o ultimo octeto, IPv6 perde a
# metade final, e o que nao casar com nenhum dos dois vira 0.0.0.0.
map $remote_addr $ip_anon {
    default                                        "0.0.0.0";
    ~^(\d+\.\d+\.\d+)\.                            "$1.0";
    ~^([0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):    "$1::";
}

log_format privacy '$ip_anon - [$time_local] "$request" $status $body_bytes_sent';

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log privacy;
    error_log  /var/log/nginx/error.log  warn;

    # Nao entregar a versao do nginx para quem varre a internet.
    server_tokens off;

    # ------------------------------------------------------------ compressao
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # text/html ja entra por padrao; repetir aqui gera warning no `nginx -t`.
    gzip_types      text/plain text/css application/javascript image/svg+xml;

    # -------------------------------------------------------------- cabecalhos
    #
    # ATENCAO ao mexer: `add_header` nao acumula entre niveis. Um unico
    # `add_header` dentro de um `location` DESCARTA todos os do `server`. Por
    # isso todos moram aqui, e nenhum `location` abaixo declara cabecalho.
    #
    # A pagina e 100% autocontida: nada de CDN, fonte externa, imagem remota ou
    # chamada de rede. A CSP trava exatamente isso — se um dia alguem colar um
    # script de analytics no HTML, o navegador recusa.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options     "nosniff"      always;
    add_header X-Frame-Options            "DENY"         always;
    add_header Referrer-Policy            "no-referrer"  always;
    add_header Cross-Origin-Opener-Policy "same-origin"  always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=(), interest-cohort=(), browsing-topics=()" always;
    add_header Cache-Control              "public, max-age=3600, must-revalidate" always;

    # Descomente quando houver HTTPS na frente (proxy reverso ou certbot).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------------------------------------ rotas
    # Checagem de saude para o HEALTHCHECK do container e para o proxy reverso.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Enderecos amigaveis, para caber em qualquer campo do Play Console.
    # Sao matches EXATOS: nao pegam o /index.html usado pelo try_files abaixo,
    # entao nao existe risco de loop de redirecionamento.
    location = /privacidade { return 301 /; }
    location = /privacy     { return 301 /; }

    # So existe um arquivo no site. Qualquer caminho serve a propria politica —
    # link errado colado no Play Console nunca vira 404 na frente do revisor.
    location / {
        try_files /index.html =404;
    }
}
